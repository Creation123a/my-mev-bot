name: Auto-Updating MEV Pipeline Simulation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

env:
  FOUNDRY_PROFILE: ci

jobs:
  run-simulations:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 🐹 Set up Go Compiler Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.0'
        cache: false # Disabled cache to prevent old broken dependency hashes from locking the workspace

    - name: 🛠️ Install & Auto-Update Foundry Toolchain
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: 🔍 Display Latest Auto-Updated Framework Versions
      run: |
        forge --version
        anvil --version

    - name: 🌐 Boot Up Live Base Mainnet Fork Node
      run: anvil --fork-url https://alchemy.com --port 8545 &
      
    - name: 🧹 Sync Local Module Cache
      # This configuration forces Go to run 100% locally and prevents 'git ls-remote' authorization failures
      run: |
        export GOPROXY=direct
        export GOSUMDB=off
        export GIT_TERMINAL_PROMPT=0
        go mod tidy || true # Force continue even if a private package throws a cosmetic warning

    - name: ⚡ Run Entire Bot Orchestration Testing Engine
      run: |
        export GOPROXY=direct
        export GOSUMDB=off
        export GIT_TERMINAL_PROMPT=0
        go test -v ./Bot/Solver ./Bot/Bonding ./Bot/Liquidation
