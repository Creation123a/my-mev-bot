name: 50‑Minute Replay Stress Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Manual trigger

env:
  SKIP_TLS_VERIFY: true   # Accept self‑signed certificate

jobs:
  replay-soak-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55   # 50 minutes + buffer

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🐹 Set up Go Compiler Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
          cache: true

      - name: 🧹 Sync Module Database
        run: go mod tidy

      - name: 📦 Install mock server dependencies
        run: go get github.com/gorilla/websocket

      # ---- Start the Replay Mock Server ----
      - name: 🧪 Start Replay Mock Server
        run: |
          echo "🔑 Generating self‑signed SSL certificate..."
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 1 -nodes \
            -subj "/CN=localhost" \
            -addext "subjectAltName = DNS:localhost, IP:127.0.0.1"

          echo "🏛️ Installing certificate into system trust store..."
          sudo cp cert.pem /usr/local/share/ca-certificates/localhost-mock.crt
          sudo update-ca-certificates

          echo "🔨 Compiling replay mock server..."
          go build -a -o mockserver cmd/mockserver/main.go

          echo "🚀 Launching replay server in background..."
          ./mockserver > mockserver.log 2>&1 &

          echo "⏱️ Waiting for server to be ready..."
          for i in {1..10}; do
            if nc -z 127.0.0.1 8546; then
              echo "✅ Replay server online."
              break
            fi
            sleep 1
          done

      # ---- Configure .env ----
      - name: ⚙️ Configure Staging Environment
        run: |
          cat << 'EOF' > .env
          BASE_WS_RPC=wss://localhost:8546/ws
          BASE_HTTP_RPC=https://localhost:8546
          BASE_EXEC_RPC=https://localhost:8546

          FLASH_EXECUTOR_ADDRESS=0x4200000000000000000000000000000000000006
          BONDING_EXECUTOR_ADDRESS=0x4200000000000000000000000000000000000006
          LIQUIDATION_EXECUTOR_ADDRESS=0x4200000000000000000000000000000000000006

          PRIVATE_KEY=31fA4fec1e21a0e05fd465fafb81409477fb274ef2c2bbc98bdca5a2c28b6bae
          MIN_PROFIT_USD=0.01
          LOAN_PROVIDER=BALANCER
          ENABLE_CPU_PINNING=false
          DRY_RUN=true
          DASHBOARD_TOKEN=test123
          EOF

      # ---- Run the Bot with 50‑Minute Monitoring ----
      - name: 🚀 Run 50‑Minute Stability & Retry Verification
        run: |
          go run main.go > bot_execution.log 2>&1 &
          BOT_PID=$!

          echo "🔄 Soak test started. Monitoring for 50 minutes..."

          for minute in {1..50}; do
            sleep 60

            if ! kill -0 $BOT_PID 2>/dev/null; then
              echo "❌ Bot crashed at minute $minute!"
              echo "=== LAST 50 LINES OF BOT LOG ==="
              cat bot_execution.log | tail -n 50
              echo "=== MOCK SERVER LOG STATUS ==="
              cat mockserver.log | tail -n 20
              exit 1
            fi

            echo "⏱️ Heartbeat: $minute/50 minutes elapsed."
            TX_COUNT=$(grep -c "successfulmocktransactionhash" bot_execution.log || true)
            echo "🔄 Total simulated transactions: $TX_COUNT"
          done

          echo "✅ Bot passed the 50‑minute durability test!"
          kill $BOT_PID
          exit 0
