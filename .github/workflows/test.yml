name: 4-Hour Automated Production Dry-Run

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

env:
  FOUNDRY_PROFILE: ci

jobs:
  long-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v4

    - name: 🐹 Set up Go Compiler Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.0'
        cache: false # FIXED: Placed on its own line with correct indentation

    - name: 🧹 Sync Module Database
      run: go mod tidy

    - name: ⚡ Configure Staging Environment & Run Bot Engine
      run: |
        cat << 'EOF' > .env
        # 1. READ CHANNEL: Subscribes directly to live data events on-chain
        BASE_WS_RPC=wss://base-mainnet.g.alchemy.com/v2/alch_ar5CTuyPtybvBAtXox8ju
        
        # 2. WRITE/SIMULATION CHANNEL: Points directly to secure Alchemy HTTPS
        # This completely satisfies your Go code's strict 'https' validation check!
        BASE_HTTP_RPC=https://base-mainnet.g.alchemy.com/v2/alch_ar5CTuyPtybvBAtXox8ju
        BASE_EXEC_RPC=https://base-mainnet.g.alchemy.com/v2/alch_ar5CTuyPtybvBAtXox8ju
        
        # Executor Strategy Mapping
        FLASH_EXECUTOR_ADDRESS=0x4200000000000000000000000000000000000006
        BONDING_EXECUTOR_ADDRESS=0x4200000000000000000000000000000000000006
      
        
        PRIVATE_KEY=31fA4fec1e21a0e05fd465fafb81409477fb274ef2c2bbc98bdca5a2c28b6bae
        MIN_PROFIT_USD=0.01
        LOAN_PROVIDER=BALANCER
        ENABLE_CPU_PINNING=false
        DRY_RUN=true
        DASHBOARD_TOKEN=test123
        EOF

        # Align global environment fallback handles directly to secure mainnet
        export BASE_RPC_URL="https://base-mainnet.g.alchemy.com/v2/alch_ar5CTuyPtybvBAtXox8ju"
        export BASE_WSS_URL="wss://base-mainnet.g.alchemy.com/v2/alch_ar5CTuyPtybvBAtXox8ju"
        export PRIVATE_KEY="31fA4fec1e21a0e05fd465fafb81409477fb274ef2c2bbc98bdca5a2c28b6bae"

        # 3. Fire the long-duration strategy validation step
        timeout 4h go run main.go || id=$? && [ $id -eq 124 ] && echo "🎉 SUCCESS: Bonding curve!" || exit $id
