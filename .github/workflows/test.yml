name: End-to-End Live Production Sniper Simulation

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

env:
  FOUNDRY_PROFILE: ci

jobs:
  production-simulation:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v4

    - name: 🐹 Set up Go Compiler Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.0'
        cache: false

    - name: 🛠️ Install & Auto-Update Foundry Toolchain
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: 🌐 Boot Up Private Local Base Mainnet Fork Node
      # This local fork acts as your real-time staging sandbox playground
      run: anvil --fork-url https://alchemy.com --port 8545 &
      
    - name: 🧹 Sync Module Database
      run: go mod tidy

    - name: ⚡ Compile and Execute Complete End-to-End Bot Engine
      run: 
        # 1. Overwrite your execution target variables to send transactions to local Anvil
        export BASE_RPC_URL="http://127.0.0.1:8545"
        
        # 2. Keep ingestion listening to live mainnet data streams
        export BASE_WSS_URL="wss://base-mainnet.g.alchemy.com/v2/alch_N3vxXXHx0b6NgDUEHff7A"
        
        # 3. Compile and boot the whole bot binary directly from main.go
        # timeout 45s stops the script safely after 45 seconds so the runner logs out success metrics
        timeout 45s go run main.go || id=$? && [ $id -eq 124 ] && echo "🎉 SUCCESS: Bot successfully ingested, calculated, and simulated live blocks without crashing!" || exit $id
