name: 4‑Hour Stress Test & MEV Simulation

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Manual trigger to save free minutes

env:
  FOUNDRY_PROFILE: ci
  SKIP_TLS_VERIFY: true   # <-- IMPORTANT: skip TLS verification for self‑signed cert

jobs:
  long-duration-soak-test:
    runs-on: ubuntu-latest
    timeout-minutes: 250   # 4 hours + buffer

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🐹 Set up Go Compiler Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
          cache: true

      - name: 🧹 Sync Module Database
        run: |
          go env -w GOPROXY="https://proxy.golang.org,direct"
          go mod tidy

      - name: 📦 Install mock server dependencies
        run: go get github.com/gorilla/websocket

      # ---- Start the Replay Mock Server over WSS ----
      - name: 🧪 Start Replay Mock Server
        run: |
          echo "🔑 Generating modern local SSL certificate with SAN..."
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 1 -nodes \
            -subj "/CN=localhost" \
            -addext "subjectAltName = DNS:localhost, IP:127.0.0.1"

          echo "🏛️ Installing self-signed certificate into Ubuntu system trust store..."
          sudo cp cert.pem /usr/local/share/ca-certificates/localhost-mock.crt
          sudo update-ca-certificates

          echo "🔨 Compiling the TLS replay mock server..."
          go build -a -o mockserver cmd/mockserver/main.go

          echo "🚀 Launching replay server in background..."
          ./mockserver > mockserver.log 2>&1 &

          echo "⏱️ Waiting for server to initialize..."
          SERVER_UP=false
          for i in {1..10}; do
            if nc -z 127.0.0.1 8546; then
              echo "✅ Replay mock server online over TLS!"
              SERVER_UP=true
              break
            fi
            sleep 1
          done

          if [ "$SERVER_UP" = false ]; then
            echo "❌ CRITICAL: Replay mock server failed to start."
            cat mockserver.log
            exit 1
          fi

      # ---- Configure .env to point to local mock server ----
      - name: ⚙️ Configure Staging Environment
        run: |
          cat << 'EOF' > .env
          BASE_WS_RPC=wss://localhost:8546/ws
          BASE_HTTP_RPC=https://localhost:8546
          BASE_EXEC_RPC=https://localhost:8546

          FLASH_EXECUTOR_ADDRESS=0x4200000000000000000000000000000000000006
          BONDING_EXECUTOR_ADDRESS=0x4200000000000000000000000000000000000006
          LIQUIDATION_EXECUTOR_ADDRESS=0x4200000000000000000000000000000000000006

          PRIVATE_KEY=31fA4fec1e21a0e05fd465fafb81409477fb274ef2c2bbc98bdca5a2c28b6bae
          MIN_PROFIT_USD=0.01
          LOAN_PROVIDER=BALANCER
          ENABLE_CPU_PINNING=false
          DRY_RUN=true
          DASHBOARD_TOKEN=test123
          EOF

          echo "BASE_RPC_URL=https://localhost:8546" >> $GITHUB_ENV
          echo "BASE_WSS_URL=wss://localhost:8546/ws" >> $GITHUB_ENV
          echo "PRIVATE_KEY=31fA4fec1e21a0e05fd465fafb81409477fb274ef2c2bbc98bdca5a2c28b6bae" >> $GITHUB_ENV
          # Remove the ineffective GODEBUG line – SKIP_TLS_VERIFY is set globally

      # ---- Run the Bot with 4‑Hour Monitoring ----
      - name: 🚀 Run 4‑Hour Stability & Retry Verification
        run: |
          go run main.go > bot_execution.log 2>&1 &
          BOT_PID=$!

          echo "🔄 Soak test started. Monitoring for 4 hours..."

          for minute in {1..240}; do
            sleep 60

            if ! kill -0 $BOT_PID 2>/dev/null; then
              echo "❌ Bot crashed at minute $minute!"
              echo "=== LAST 50 LINES OF BOT LOG ==="
              cat bot_execution.log | tail -n 50
              echo "=== MOCK SERVER LOG STATUS ==="
              cat mockserver.log | tail -n 20
              exit 1
            fi

            echo "⏱️ Heartbeat: $minute/240 minutes elapsed."
            RETRY_COUNT=$(grep -c "successfulmocktransactionhash" bot_execution.log || true)
            echo "🔄 Total simulated transactions: $RETRY_COUNT"
          done

          echo "✅ Bot passed the 4‑hour durability test!"
          kill $BOT_PID
          exit 0
