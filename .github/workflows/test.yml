name: 4-Hour Automated Production Dry-Run

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger a fresh 4-hour monitoring sweep with 1-click

env:
  FOUNDRY_PROFILE: ci

jobs:
  long-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # Strict 4-hour timeout ceiling to safeguard your account quotas

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v4

    - name: 🐹 Set up Go Compiler Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.0'
        cache: false

    - name: 🛠️ Install & Auto-Update Foundry Toolchain
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: 🌐 Boot Up Private Local Base Mainnet Fork Node
      run: |
        RPC_URL=$(echo "wss://base-mainnet.g.alchemy.com/v2/alch_N3vxXXHx0b6NgDUEHff7A" | sed 's/wss:/https:/')
        anvil --fork-url $RPC_URL --port 8545 &
      
    - name: 🧹 Sync Module Database
      run: go mod tidy

    - name: ⚡ Configure Staging Environment & Run Bot Engine
      run: |
        # 1. Generate an active .env context block inside the runner directory
        # Set to use the specific dummy address layout from your Codespace variables configuration matrix
        cat << 'EOF' > .env
        BASE_WS_RPC=wss://base-mainnet.g.alchemy.com/v2/alch_N3vxXXHx0b6NgDUEHff7A
        BASE_HTTP_RPC=https://base-mainnet.g.alchemy.com/v2/alch_N3vxXXHx0b6NgDUEHff7A
        BASE_EXEC_RPC=http://127.0.0.1:8545
        FLASH_EXECUTOR_ADDRESS=0x4200000000000000000000000000000000000006
        PRIVATE_KEY=31fA4fec1e21a0e05fd465fafb81409477fb274ef2c2bbc98bdca5a2c28b6bae
        MIN_PROFIT_USD=0.01
        LOAN_PROVIDER=BALANCER
        ENABLE_CPU_PINNING=false
        DRY_RUN=true
        DASHBOARD_TOKEN=test123
        EOF

        # 2. Bind matching system shell environment variables as fallback hooks
        export BASE_RPC_URL="http://127.0.0.1:8545"
        export BASE_WSS_URL="wss://base-mainnet.g.alchemy.com/v2/alch_N3vxXXHx0b6NgDUEHff7A"
        export PRIVATE_KEY="31fA4fec1e21a0e05fd465fafb81409477fb274ef2c2bbc98bdca5a2c28b6bae"

        # 3. Fire the long-duration 4-hour mainnet live validation stream exclusively for your sniper loop
        # We explicitly isolate the execution path to trigger your target main loop binary 
        timeout 4h go run main.go || id=$? && [ $id -eq 124 ] && echo "🎉 SUCCESS: Bonding curve strategy executed safely for 4 hours!" || exit $id
