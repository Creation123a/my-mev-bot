name: Auto-Updating MEV Pipeline Simulation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

env:
  FOUNDRY_PROFILE: ci

jobs:
  run-simulations:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 🐹 Set up Go Compiler Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.0'
        cache: false

    - name: 🛠️ Install & Auto-Update Foundry Toolchain
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: 🌐 Boot Up Live Base Mainnet Fork Node
      run: anvil --fork-url https://alchemy.com --port 8545 &
      
    - name: 🧹 Securely Sync and Hash Module Cache
      # Removed all proxy limits and force overrides so Go can build a perfect go.sum database natively
      run: |
        go mod tidy

    - name: ⚡ Run Entire Bot Orchestration Testing Engine
      # Removed GOSUMDB=off entirely so your build runs cleanly without locking your local packages
      run: |
        go test -v ./Bot/Solver ./Bot/Bonding ./Bot/Liquidation
