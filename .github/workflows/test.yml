name: 4‑Hour Stress Test & MEV Simulation

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Manual trigger to save free minutes

env:
  FOUNDRY_PROFILE: ci

jobs:
  long-duration-soak-test:
    runs-on: ubuntu-latest
    timeout-minutes: 250   # 4 hours + buffer

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🐹 Set up Go Compiler Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
          cache: false

      - name: 🧹 Sync Module Database
        run: go mod tidy
        
      - name: 📦 Install mock server dependencies
        run: go get github.com/gorilla/websocket

           # ---- Start the Mock MEV Simulator ----
      - name: 🧪 Start Mock RPC/WebSocket Server
        run: |
          echo "🔨 Pre-compiling the mock server..."
          go build -o mockserver cmd/mockserver/main.go

          echo "🚀 Launching compiled mock server in background..."
          ./mockserver > mockserver.log 2>&1 &
          
          echo "⏱️ Waiting for server to initialize..."
          # Loop up to 10 times checking every second to give it a solid buffer
          for i in {1..10}; do
            if nc -z 127.0.0.1 8546; then
              echo "✅ Mock server online and listening on port 8546!"
              exit 0
            fi
            sleep 1
          done

          echo "❌ CRITICAL: Mock server failed to start within 10 seconds."
          echo "=== MOCK SERVER BUILD/RUN LOGS ==="
          cat mockserver.log
          exit 1


      # ---- Configure .env to point to local mock server ----
      - name: ⚙️ Configure Staging Environment
        run: |
          cat << 'EOF' > .env
          # READ CHANNEL: Local WebSocket mock
          BASE_WS_RPC=ws://localhost:8546/ws

          # WRITE/SIMULATION CHANNEL: Local HTTP mock
          BASE_HTTP_RPC=http://localhost:8546
          BASE_EXEC_RPC=http://localhost:8546

          # Executor addresses (dummy, but your bot expects them)
          FLASH_EXECUTOR_ADDRESS=0x4200000000000000000000000000000000000006
          BONDING_EXECUTOR_ADDRESS=0x4200000000000000000000000000000000000006
          LIQUIDATION_EXECUTOR_ADDRESS=0x4200000000000000000000000000000000000006

          PRIVATE_KEY=31fA4fec1e21a0e05fd465fafb81409477fb274ef2c2bbc98bdca5a2c28b6bae
          MIN_PROFIT_USD=0.01
          LOAN_PROVIDER=BALANCER
          ENABLE_CPU_PINNING=false
          DRY_RUN=true        # <-- Tells your bot to skip heavy historical scans
          DASHBOARD_TOKEN=test123
          EOF

          # FIX: Write cross-step variables to GITHUB_ENV instead of using local exports
          echo "BASE_RPC_URL=http://localhost:8546" >> $GITHUB_ENV
          echo "BASE_WSS_URL=ws://localhost:8546/ws" >> $GITHUB_ENV
          echo "PRIVATE_KEY=31fA4fec1e21a0e05fd465fafb81409477fb274ef2c2bbc98bdca5a2c28b6bae" >> $GITHUB_ENV

      # ---- Run the Bot with 4‑Hour Monitoring ----
      - name: 🚀 Run 4‑Hour Stability & Retry Verification
        run: |
          # Launch the bot
          go run main.go > bot_execution.log 2>&1 &
          BOT_PID=$!

          echo "🔄 Soak test started. Monitoring for 4 hours (240 minutes)..."

          # 4 hours = 240 minutes, check every 60 seconds
          for minute in {1..240}; do
            sleep 60

            # Check if bot crashed
            if ! kill -0 $BOT_PID 2>/dev/null; then
              echo "❌ Bot crashed at minute $minute!"
              echo "=== LAST 50 LINES OF BOT LOG ==="
              tail -n 50 bot_execution.log
              exit 1
            fi

            # Heartbeat for GitHub UI (prevents timeout)
            echo "⏱️ Heartbeat: $minute/240 minutes elapsed."

            # Optional: count how many times competition triggered a retry
            RETRY_COUNT=$(grep -c "Frontrun" bot_execution.log || true)
            echo "🔄 Total simulated frontruns handled: $RETRY_COUNT"
          done

          echo "✅ Bot passed the 4‑hour durability test without crashes!"
          kill $BOT_PID
          exit 0
