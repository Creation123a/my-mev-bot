name: 4-Hour Automated Production Dry-Run

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger a fresh 4-hour monitoring sweep with 1-click

env:
  FOUNDRY_PROFILE: ci

jobs:
  long-dry-run:
    runs-on: ubuntu-latest
    # Set the strict ceiling to 240 minutes (4 Hours) to protect your free monthly allowance limits
    timeout-minutes: 240 

    steps:
    - name: 📥 Check out repository code
      uses: actions/checkout@v4

    - name: 🐹 Set up Go Compiler Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.0'
        cache: false

    - name: 🛠️ Install & Auto-Update Foundry Toolchain
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: 🌐 Boot Up Private Local Base Mainnet Fork Node
      # The local anvil fork acts as your real-time staging sandbox database layer
      run: |
        RPC_URL=$(echo "wss://://alchemy.com" | sed 's/wss:/https:/')
        anvil --fork-url $RPC_URL --port 8545 &
      
    - name: 🧹 Sync Module Database
      run: go mod tidy

    - name: ⚡ Run Bot Pipeline (4-Hour Live Streaming Observation)
      run: |
        export BASE_RPC_URL="http://127.0.0.1:8545"
        export BASE_WSS_URL="wss://://alchemy.com"
        
        # 'timeout 4h' tells the server to monitor live mainnet blocks for 4 hours
        # It logs successes out cleanly before safely completing the workflow run
        timeout 4h go run main.go || id=$? && [ $id -eq 124 ] && echo "🎉 SUCCESS: Bot securely ingested and simulated live blocks for 4 hours without memory leaks!" || exit $id
